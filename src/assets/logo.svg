<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600"
     role="img" aria-label="Get Git — download a repository" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <!-- knocks the frame out wherever the glyph or the arrow crosses it -->
    <mask id="cut">
      <rect width="600" height="600" fill="#fff"/>

      <path d="M401 345 H479 A11 11 0 0 1 490 356 V445 H525 L440 545 L355 445 H390 V356 A11 11 0 0 1 401 345 Z"
            fill="#000" stroke="#000" stroke-width="26" stroke-linejoin="round"/>

      <g transform="translate(109.4,120.8) scale(0.66)"
         fill="none" stroke="#000" stroke-width="54"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M178 82 V391"/>
        <path d="M178 150 L50 253 V291"/>
        <path d="M305 177 V228 L186 303"/>
        <circle cx="178" cy="48"  r="24" stroke-width="44"/>
        <circle cx="305" cy="143" r="24" stroke-width="44"/>
        <circle cx="50"  cy="325" r="24" stroke-width="44"/>
        <circle cx="178" cy="425" r="24" stroke-width="44"/>
      </g>
    </mask>
  </defs>

  <!-- optional backdrop: uncomment for a white plate -->
  <!-- <rect width="600" height="600" fill="#FFFFFF"/> -->

  <!-- frame -->
  <rect x="150" y="110" width="330" height="390" rx="46" mask="url(#cut)"
        fill="none" stroke="#4B5563" stroke-width="22"/>

  <!-- version control glyph -->
  <g transform="translate(109.4,120.8) scale(0.66)"
     fill="none" stroke="#28FE14" stroke-width="30"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M178 82 V391"/>
    <path d="M178 150 L50 253 V291"/>
    <path d="M305 177 V228 L186 303"/>
    <circle cx="178" cy="48"  r="24" stroke-width="20"/>
    <circle cx="305" cy="143" r="24" stroke-width="20"/>
    <circle cx="50"  cy="325" r="24" stroke-width="20"/>
    <circle cx="178" cy="425" r="24" stroke-width="20"/>
  </g>

  <!-- download arrow -->
  <path d="M401 345 H479 A11 11 0 0 1 490 356 V445 H525 L440 545 L355 445 H390 V356 A11 11 0 0 1 401 345 Z"
        fill="#28FE14"/>
</svg>